# Unified demo: ONE public process on :8023 with B embedded in-process.
# Seed job writes intelligence.db; main-app reads it (no forever :8765 sidecar).
# One-click: ./scripts/demo-up.sh
# Smoke:     ./scripts/demo-smoke.sh
#
# Host ports are fixed (127.0.0.1 only). Do not change casually.
# Legacy sidecar: set COMPOSE_PROFILES=sidecar (or docker compose --profile sidecar).

name: ai-sec-intel-demo

services:
  b-seed:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    image: ai-sec-intel-b:demo
    user: "10001:10001"
    volumes:
      - b-data:/app/data
    command: ["python", "seed_demo_db.py", "--force"]
    restart: "no"

  # Optional legacy B HTTP process (not started by default).
  b-api:
    profiles: ["sidecar"]
    image: ai-sec-intel-b:demo
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      b-seed:
        condition: service_completed_successfully
    environment:
      INTELLIGENCE_DB_PATH: /app/data/intelligence.db
      PYTHONUTF8: "1"
    volumes:
      - b-data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    command: ["python", "run_intelligence_api_v6.py", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:8765/api/intelligence/health', timeout=5); assert json.load(r).get('database_available') is True",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-sec-intel-main:demo
    restart: unless-stopped
    init: true
    depends_on:
      b-seed:
        condition: service_completed_successfully
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8023"
      TEAM_INTEL_MODE: embed
      INTELLIGENCE_DB_PATH: /app/intelligence/data/intelligence.db
      B_MONITOR_ENABLED: "1"
      B_MONITOR_ON_REFRESH: "1"
      B_MONITOR_SOURCE_TIMEOUT: "45"
      B_MONITOR_OVERALL_TIMEOUT: "180"
      # Stable demo default: skip long network ingest on every collect.
      AUTO_INGEST_ON_COLLECT: ${AUTO_INGEST_ON_COLLECT:-0}
      # Actions → deploy ingest (optional). Set on host to enable POST /api/admin/actions-sync.
      ACTIONS_INGEST_TOKEN: ${ACTIONS_INGEST_TOKEN:-}
      ACTIONS_SYNC_ON_START: ${ACTIONS_SYNC_ON_START:-0}
      ACTIONS_SYNC_TOKEN: ${ACTIONS_SYNC_TOKEN:-${GITHUB_TOKEN:-}}
      ACTIONS_SYNC_REPOSITORY: ${ACTIONS_SYNC_REPOSITORY:-sijunxiaodeng/ai-sec-intel}
      ACTIONS_SYNC_BRANCH: ${ACTIONS_SYNC_BRANCH:-main}
      PYTHONUTF8: "1"
    volumes:
      - main-data:/app/data
      - b-data:/app/intelligence/data
    ports:
      - "127.0.0.1:8023:8023"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8023/api/overview', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      start_period: 25s
      retries: 5

volumes:
  b-data:
  main-data:
