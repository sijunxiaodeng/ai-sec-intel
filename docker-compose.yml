# 联网演示（非默认）。产品面仅 :8023；查询 embed，采集为有界子进程。
# 默认一键: docker compose -f docker-compose.offline.yml up --build -d
# 本文件:   docker compose -f docker-compose.yml up --build -d
# 冒烟:     ./scripts/demo-smoke.sh
# 种子写演示卷；正式数据见 docker-compose.production.yml / actions.yml
#
# Host ports are fixed (127.0.0.1 only). Do not change casually.
# Legacy sidecar: set COMPOSE_PROFILES=sidecar (or docker compose --profile sidecar).

name: ai-sec-intel-demo

services:
  b-seed:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    image: ai-sec-intel-b:demo
    user: "10001:10001"
    volumes:
      - b-data:/app/data
    # Existing state is retained, including live records collected after seeding.
    command: ["python", "seed_demo_db.py"]
    restart: "no"

  # Optional legacy B HTTP process (not started by default).
  b-api:
    profiles: ["sidecar"]
    image: ai-sec-intel-b:demo
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      b-seed:
        condition: service_completed_successfully
    environment:
      INTELLIGENCE_DB_PATH: /app/data/intelligence.db
      PYTHONUTF8: "1"
    volumes:
      - b-data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    command: ["python", "run_intelligence_api_v6.py", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:8765/api/intelligence/health', timeout=5); assert json.load(r).get('database_available') is True",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-sec-intel-main:demo
    restart: unless-stopped
    init: true
    depends_on:
      b-seed:
        condition: service_completed_successfully
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8023"
      TEAM_INTEL_MODE: embed
      MAIN_IMPORT_DEMO_CARDS: "1"
      MAIN_DATA_DIR: /app/data
      INTELLIGENCE_DB_PATH: /app/intelligence/data/intelligence.db
      B_MONITOR_ENABLED: ${B_MONITOR_ENABLED:-1}
      B_MONITOR_ON_REFRESH: ${B_MONITOR_ON_REFRESH:-1}
      AUTO_MONITOR_ON_START: ${AUTO_MONITOR_ON_START:-1}
      AUTO_MONITOR_ENABLED: ${AUTO_MONITOR_ENABLED:-1}
      MONITOR_INTERVAL_MINUTES: ${MONITOR_INTERVAL_MINUTES:-}
      MONITOR_INTERVAL_HOURS: ${MONITOR_INTERVAL_HOURS:-}
      B_MONITOR_SOURCE_TIMEOUT: ${B_MONITOR_SOURCE_TIMEOUT:-45}
      B_MONITOR_OVERALL_TIMEOUT: ${B_MONITOR_OVERALL_TIMEOUT:-180}
      # Stable demo default: skip long network ingest on every collect.
      AUTO_INGEST_ON_COLLECT: ${AUTO_INGEST_ON_COLLECT:-0}
      # Verified Actions delivery has its own isolated docker-compose.actions.yml.
      PYTHONUTF8: "1"
    volumes:
      - main-data:/app/data
      - b-data:/app/intelligence/data
    ports:
      - "127.0.0.1:8023:8023"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8023/api/overview', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      start_period: 25s
      retries: 5

volumes:
  b-data:
  main-data:
