# Optional overlay for exactly one production mode. Requires a local Grafana
# admin password; expose dashboards only over localhost or an authenticated proxy.
services:
  ops-metrics:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-sec-intel-main:production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes_from:
      - main-app:ro
    depends_on:
      b-api:
        condition: service_started
      main-app:
        condition: service_started
    command: ["python", "scripts/ops_metrics.py", "--host", "0.0.0.0", "--b-base", "http://b-api:8765", "--main-db", "/app/data/knowledge.sqlite3"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ops-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ops-metrics:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in local .env.production for the optional observability overlay}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - ops-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ops-prometheus-data:
  ops-grafana-data:
