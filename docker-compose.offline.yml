# 默认演示路径。单端口 :8023，合成样例，不联网采集。
# 启动: docker compose -f docker-compose.offline.yml up --build -d
# 停止: docker compose -f docker-compose.offline.yml down
# 数据卷: offline-demo-data
name: ai-sec-intel-offline-demo
services:
  app:
    build: .
    image: ai-sec-intel-main:offline-demo
    init: true
    command: ["python", "scripts/offline_demo.py", "--data-directory", "/app/data/offline-demo", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8023:8023"
    volumes:
      - offline-demo-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8023/api/overview',timeout=5)); assert d['offline_demo'] and d['items']>=5 and d['library']['documents']>=7"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
volumes:
  offline-demo-data:
