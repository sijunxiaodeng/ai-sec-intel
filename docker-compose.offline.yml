name: ai-sec-intel-offline-demo
services:
  app:
    build: .
    image: ai-sec-intel-main:offline-demo
    init: true
    command: ["python", "scripts/offline_demo.py", "--data-directory", "/app/data/offline-demo", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8023:8023"
    volumes:
      - offline-demo-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8023/api/overview',timeout=5)); assert d['offline_demo'] and d['items']>=4 and d['library']['documents']>=4"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
volumes:
  offline-demo-data:
