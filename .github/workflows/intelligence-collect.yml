name: B public intelligence collection

on:
  schedule:
    # UTC; equivalent to every 15 minutes in any timezone. Avoid minute 0 peaks.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      deepseek_review:
        description: Run up to two DeepSeek semantic reviews after public collection
        required: false
        default: true
        type: boolean
      bootstrap_release_tag:
        description: Same-repository release tag for the initial public-data snapshot
        required: false
        type: string
      bootstrap_state_commit:
        description: Full 40-character same-repository commit SHA containing the fixed initial snapshot file
        required: false
        type: string

permissions:
  contents: read
  actions: write

# Same branch uses one database lineage. Never cancel a writer that must upload.
concurrency:
  group: intelligence-public-collector
  cancel-in-progress: false

jobs:
  collect:
    # A manual dispatch on a feature branch must not create another database.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      AUTO_CLASSIFY_V5: '1'
      CLASSIFY_V5_MAX_ITEMS: '300'
      CLASSIFY_V5_MAX_LLM_CALLS: '0'
      CLASSIFY_V4_MAX_LLM_CALLS: '0'
      CLOUD_COLLECTION_STARTED_AT: '2026-10-09T12:05:16Z'
      DEEPSEEK_KEY_AVAILABLE: ${{ secrets.DEEPSEEK_API_KEY != '' }}
      DEEPSEEK_REVIEW_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.deepseek_review }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      GITHUB_TOKEN: ${{ github.token }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      INTELLIGENCE_BOOTSTRAP_RELEASE_TAG: ${{ inputs.bootstrap_release_tag || vars.INTELLIGENCE_BOOTSTRAP_RELEASE_TAG }}
      INTELLIGENCE_BOOTSTRAP_STATE_COMMIT: ${{ inputs.bootstrap_state_commit || vars.INTELLIGENCE_BOOTSTRAP_STATE_COMMIT || 'e00c1c8abf2c2ab360ca95204a483fbf83fd1063' }}
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          # Only this small workflow needs to be in the default branch. B's
          # runtime stays on its existing team branch; A/C are not overwritten.
          ref: feat/intelligence
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.lock.txt
      - name: Restore durable public state
        id: restore
        run: python intelligence/deployment/actions_state.py restore --directory intelligence/data
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r intelligence/requirements.lock.txt
      - name: Collect public intelligence
        id: collect
        timeout-minutes: 11
        # GNU timeout stops the whole child process group. State upload still runs.
        run: timeout --signal=TERM --kill-after=20s 10m python -u intelligence/run_monitor.py --once --source-timeout 120 --workers 4
      - name: Review ambiguous intelligence with DeepSeek
        id: deepseek
        if: ${{ always() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' && env.DEEPSEEK_KEY_AVAILABLE == 'true' && env.DEEPSEEK_REVIEW_ENABLED == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          # The paid-provider key is available only to this bounded model phase.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python intelligence/deployment/deepseek_review.py --db intelligence/data/intelligence.db
      - name: Record disabled or unavailable model review
        if: ${{ always() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' && !(env.DEEPSEEK_KEY_AVAILABLE == 'true' && env.DEEPSEEK_REVIEW_ENABLED == 'true') }}
        continue-on-error: true
        run: python intelligence/deployment/deepseek_review.py --db intelligence/data/intelligence.db
      - name: Record public collection facts
        if: ${{ always() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' }}
        run: python intelligence/deployment/actions_report.py record --directory intelligence/data
      - name: Prepare consistent SQLite snapshot
        id: snapshot
        if: ${{ always() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' }}
        run: python intelligence/deployment/actions_state.py save --source intelligence/data --directory "${RUNNER_TEMP}/intelligence-state"
      - name: Persist public collection state
        id: upload
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-state-${{ github.run_id }}
          path: ${{ runner.temp }}/intelligence-state/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Push snapshot to deploy ingest API (optional)
        # Real sync path: artifact alone never reaches a running 8023 DB.
        # When DEPLOY_INGEST_URL + DEPLOY_INGEST_TOKEN secrets are set, POST the
        # verified snapshot zip to the main app's /api/admin/actions-sync.
        if: ${{ always() && steps.snapshot.outcome == 'success' && secrets.DEPLOY_INGEST_URL != '' && secrets.DEPLOY_INGEST_TOKEN != '' }}
        env:
          DEPLOY_INGEST_URL: ${{ secrets.DEPLOY_INGEST_URL }}
          DEPLOY_INGEST_TOKEN: ${{ secrets.DEPLOY_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/intelligence-state"
          test -f "$STAGE/intelligence.db"
          test -f "$STAGE/manifest.json"
          ZIP="${RUNNER_TEMP}/intelligence-state-${GITHUB_RUN_ID}.zip"
          (cd "$STAGE" && zip -qr "$ZIP" .)
          ENDPOINT="${DEPLOY_INGEST_URL%/}"
          case "$ENDPOINT" in
            */api/admin/actions-sync) ;;
            *) ENDPOINT="${ENDPOINT}/api/admin/actions-sync" ;;
          esac
          echo "Pushing Actions snapshot to ${ENDPOINT}"
          curl -fsS --max-time 120 \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer ${DEPLOY_INGEST_TOKEN}" \
            -H "Content-Type: application/zip" \
            -H "X-Actions-Repository: ${GITHUB_REPOSITORY}" \
            -H "X-Actions-Branch: main" \
            -H "X-Actions-Run-Id: ${GITHUB_RUN_ID}" \
            --data-binary @"$ZIP" \
            -o "${RUNNER_TEMP}/deploy-ingest-response.json"
          echo "Deploy ingest response:"
          cat "${RUNNER_TEMP}/deploy-ingest-response.json"
          echo
      - name: Retain the latest eight trusted snapshots
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python intelligence/deployment/actions_state.py prune --directory intelligence/data --uploaded-artifact-id "$UPLOADED_ARTIFACT_ID" --keep 8
      - name: Summarize collection
        if: ${{ always() }}
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: python intelligence/deployment/actions_report.py summary --directory intelligence/data
