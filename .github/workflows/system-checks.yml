name: System checks

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  AUTO_MONITOR_ON_START: '0'
  AUTO_MONITOR_ENABLED: '0'
  B_MONITOR_ENABLED: '0'
  B_MONITOR_ON_REFRESH: '0'
  AUTO_INGEST_ON_COLLECT: '0'
  ASSET_AUTO_MATCH_ENABLED: '0'
  AUTO_CLASSIFY_V5: '0'
  ACCEPTANCE_OBSERVATION_ENABLED: '0'
  CLASSIFY_V5_MAX_LLM_CALLS: '0'
  CLASSIFY_V4_MAX_LLM_CALLS: '0'
  DEEPSEEK_REVIEW_ENABLED: 'false'
  DEEPSEEK_API_KEY: ''

jobs:
  windows-deployment-scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse deployment scripts with native Windows PowerShell
        shell: powershell
        run: |
          foreach ($file in @('scripts/production-up.ps1', 'scripts/production-check.ps1', 'scripts/tests/windows_deployment_checks.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax errors in $file" }
          }
      - name: Verify isolated Docker Desktop startup and secret boundaries
        shell: powershell
        run: .\scripts\tests\windows_deployment_checks.ps1

  windows-python-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Check native imports, status and process locks without symlink privileges
        run: python scripts/run_offline_tests.py --start-directory questions --pattern test_windows_actions_compat.py

  main-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            intelligence/requirements.lock.txt
      - name: Isolate test state from repository fixtures
        run: |
          printf '%s\n' "MAIN_KB_DB_PATH=${RUNNER_TEMP}/main-knowledge.sqlite3" "MAIN_DATA_DIR=${RUNNER_TEMP}/main-data" >> "$GITHUB_ENV"
      - name: Install main application test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test A and C without public network or model credentials
        run: python scripts/run_offline_tests.py --start-directory questions
      - name: Test fixed-window and independent-label evidence calculations
        run: python scripts/run_offline_tests.py --start-directory scripts/tests
      - name: Start a fresh offline demo and verify real HTTP import
        run: python scripts/check_offline_demo.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UI syntax and candidate detail interactions
        run: |
          node --check web/answer-content.js
          node questions/test_workbench_ui.js
          node --check web/app.js
          node --check web/risks.js
          node --check web/asset-workflow.js
          node questions/test_asset_workflow_ui.js
          node --check web/live.js
          node questions/test_live_ui.js
          node questions/test_risks_ui.js
          node questions/test_article_candidates_ui.js
          node questions/test_asset_observations_ui.js
          node questions/test_poc_sources_ui.js
          node questions/test_monitor_status_ui.js
            node --check web/acceptance.js
            node questions/test_acceptance_ui.js

  intelligence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.lock.txt
      - name: Isolate B test state
        run: printf '%s\n' "INTELLIGENCE_DB_PATH=${RUNNER_TEMP}/intelligence.sqlite3" >> "$GITHUB_ENV"
      - name: Install B locked dependencies in its separate job
        run: python -m pip install -r requirements.lock.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test collection, classification, storage, API and snapshot delivery
        run: python ../scripts/run_offline_tests.py --start-directory tests

  container-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ai-sec-intel-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate separate demo, persistent collector and Actions-consumer configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.actions.yml config --quiet
          docker compose -f docker-compose.offline.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=ci-config-validation-only docker compose -f docker-compose.production.yml -f docker-compose.observability.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=ci-config-validation-only docker compose -f docker-compose.actions.yml -f docker-compose.observability.yml config --quiet
      - name: Disable public networking and automatic collection for synthetic integration
        run: |
          cat > "${RUNNER_TEMP}/compose-offline.yml" <<'YAML'
          services:
            main-app:
              environment:
                AUTO_MONITOR_ON_START: "0"
                AUTO_MONITOR_ENABLED: "0"
                B_MONITOR_ENABLED: "0"
                B_MONITOR_ON_REFRESH: "0"
                MAIN_IMPORT_DEMO_CARDS: "0"
                AUTO_CLASSIFY_V5: "0"
                CLASSIFY_V5_MAX_LLM_CALLS: "0"
                DEEPSEEK_API_KEY: ""
                AUTO_INGEST_ON_COLLECT: "0"
                TEAM_ONLY_COLLECT: "1"
          networks:
            default:
              internal: true
          YAML
      - name: Validate Prometheus configuration and operational alert rules
        run: docker run --rm --network none --volume "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Build and start the isolated demo containers
        run: docker compose -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" up --build --detach --wait --wait-timeout 180
      - name: Verify actual B API, B-to-A records and B-to-C document synchronization
        # An internal Docker network intentionally has no host port routing.
        # Exercise the real listening HTTP app from inside its container.
        run: docker compose -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" exec -T main-app python scripts/check_container_integration.py
      - name: Verify automatic offline bootstrap inside the built image
        run: docker compose -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" exec -T main-app python scripts/check_offline_demo.py
      - name: Verify the separate B API deployment bridge
        run: |
          cat > "${RUNNER_TEMP}/compose-sidecar.yml" <<'YAML'
          services:
            main-app:
              environment:
                TEAM_INTEL_MODE: sidecar
                TEAM_INTEL_UPSTREAM: http://b-api:8765
                TEAM_INTEL_BASE_URL: http://b-api:8765
                TEAM_INTEL_PROXY: "1"
              depends_on:
                b-api:
                  condition: service_healthy
          YAML
          docker compose --profile sidecar -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" -f "${RUNNER_TEMP}/compose-sidecar.yml" up --no-build --detach --wait --wait-timeout 180
          docker compose --profile sidecar -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" -f "${RUNNER_TEMP}/compose-sidecar.yml" exec -T main-app python scripts/check_container_integration.py
      - name: Save container logs on failure
        if: failure()
        run: docker compose --profile sidecar -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" logs --no-color
      - name: Remove only this CI job's synthetic containers and volumes
        if: always()
        run: docker compose --profile sidecar -f docker-compose.yml -f "${RUNNER_TEMP}/compose-offline.yml" down --volumes --remove-orphans

# These are development behavior checks. Passing them does not establish an
# independent classification/enrichment/QA score or a six-hour collection SLA.
